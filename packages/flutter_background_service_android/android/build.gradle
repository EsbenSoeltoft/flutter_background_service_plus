plugins {
  id 'com.android.library'              // let the root project decide the AGP version
  // id 'org.jetbrains.kotlin.android'  // add if you include any Kotlin sources
}

group 'id.flutter.flutter_background_service'
version '1.0'

// In a plugin module you usually don't need repositories here;
// the root project (your app or example app) provides them.
// Safe to keep if you build the module standalone, but optional.
repositories {
  google()
  mavenCentral()
}

android {
    namespace "id.flutter.flutter_background_service"
    
    // Use centralized SDK versions if built as part of the app, otherwise fallback to defaults
    def getExtProperty = { name, defaultValue ->
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
    }

    compileSdk getExtProperty('compileSdkVersion', 36)
    
    defaultConfig {
        minSdkVersion getExtProperty('minSdkVersion', 28)
        consumerProguardFiles 'consumer-proguard-rules.pro'
    }

    // Newer style; AGP 7.4 still accepts lintOptions as well.
    lint {
        disable += ['InvalidPackage', 'DiscouragedApi', 'InlinedApi']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildFeatures {
        buildConfig true
    }
    
    buildTypes {
        release {
            // Your plugin AAR doesn’t need to be minified;
            // the important part is exporting consumer rules to the app.
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
